# Kernel-side package for the bundled lane-refill skill. It only talks to the host
# through rlm.list_subagents and agent_message; prime-agent-runtime is always installed
# in the kernel venv before skills, so it is intentionally not declared as a dependency
# (it is not published on PyPI).
[project]
name = "lane-refill"
version = "0.1.0"
description = "Prime Agent lane-refill skill: dependency-ready dispatch for ad-hoc coordinators"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lane_refill"]
